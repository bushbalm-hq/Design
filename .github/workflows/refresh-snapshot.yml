name: Refresh calendar snapshot

on:
  schedule:
    - cron: "0 14 * * 1-5"   # weekdays 14:00 UTC
  workflow_dispatch: {}      # "Run workflow" button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull from Monday and update index.html
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: python3 scripts/refresh_snapshot.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git commit -am "Refresh calendar snapshot from Monday"
          git push
